apiVersion: apps/v1
kind: Deployment
metadata:
  name: datasentry-api
  namespace: datasentry
  labels:
    app: datasentry-api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: datasentry-api
  template:
    metadata:
      labels:
        app: datasentry-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: datasentry-api
        image: datasentry:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8080
          name: metrics
        env:
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: datasentry-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: datasentry-config
              key: API_PORT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: datasentry-config
              key: LOG_LEVEL
        - name: ELASTICSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: datasentry-config
              key: ELASTICSEARCH_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: datasentry-config
              key: REDIS_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: datasentry-secrets
              key: SECRET_KEY
        - name: ADMIN_API_KEY
          valueFrom:
            secretKeyRef:
              name: datasentry-secrets
              key: ADMIN_API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: datasentry-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: datasentry-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: cache-volume
          mountPath: /app/cache
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config-volume
        configMap:
          name: datasentry-policies
      - name: cache-volume
        emptyDir: {}
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: datasentry-api-service
  namespace: datasentry
  labels:
    app: datasentry-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  selector:
    app: datasentry-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datasentry-ingress
  namespace: datasentry
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - datasentry.yourdomain.com
    secretName: datasentry-tls
  rules:
  - host: datasentry.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datasentry-api-service
            port:
              number: 80