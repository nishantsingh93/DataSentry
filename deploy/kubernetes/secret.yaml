apiVersion: v1
kind: Secret
metadata:
  name: datasentry-secrets
  namespace: datasentry
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-change-in-production"
  ADMIN_API_KEY: "your-admin-api-key-change-in-production"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  ELASTICSEARCH_PASSWORD: ""
  REDIS_PASSWORD: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: datasentry-db-secret
  namespace: datasentry
type: Opaque
stringData:
  username: "datasentry_user"
  password: "datasentry_password_change_in_production"
  database: "datasentry"
  host: "postgresql"
  port: "5432"